function md(s){let h='',tb=null,ul=false;const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
 const fl=()=>{if(tb){h+='<table>'+tb.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inl(c)}</td>`:`<th>${inl(c)}</th>`).join('')+'</tr>').join('')+'</table>';tb=null}if(ul){h+='</ul>';ul=false}};
 for(const l of s.split('\n')){if(l.startsWith('|')){if(/^\|[-| :]+\|$/.test(l))continue;if(ul){h+='</ul>';ul=false}(tb=tb||[]).push(l.split('|').slice(1,-1).map(x=>x.trim()));continue}
  if(/^\s*(-|\d+\.) /.test(l)){if(tb)fl();if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(l.replace(/^\s*(-|\d+\.) /,''))+'</li>';continue}fl();
  if(l.startsWith('## '))h+='<h3>'+inl(l.slice(3))+'</h3>';else if(l.startsWith('# '))h+='<h2>'+inl(l.slice(2))+'</h2>';else if(l.trim())h+='<p>'+inl(l)+'</p>'}fl();return h}

function tabOfT(t){const r=rootOf(t);if(!r)return null;const k=r.indexOf(':'),p=r.slice(0,k),id=r.slice(k+1);
 if(p=='char')return D.characters.some(c=>c.id==id)?'chars':null;
 if(p=='img')return D.images.some(i=>i.id==id)?'gallery':null;
 if(p=='q'){const q=D.questions.find(q=>q.id==id);return q?qTab(q):null}
 if(p=='up'||p=='post'){const x=(p=='up'?uploads():posts()).find(a=>a.id==id);if(!x)return null;if(x.tab=='idea')return 'idea';return TABS.some(t=>t[0]==x.tab)&&!NOBOX.includes(x.tab)?x.tab:(p=='up'?'files':null)}
 if(p=='line'){const l=ix().byId[id];return l&&l.kind=='line'?(String(l.scene).startsWith('unlock:')?'unlock':'script'):null}
 if(p=='fb')return ix().byId[id]?'feedback':null;

document.addEventListener('paste',e=>{if(cur!='feedback')return;const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));if(it){e.preventDefault();const f=it.getAsFile();fbLoad(URL.createObjectURL(f),'붙여넣은 화면 '+new Date().toLocaleTimeString('ko-KR'),'붙여넣기')}});
function fbDraw(ctx,st){ctx.save();ctx.strokeStyle=ctx.fillStyle=st.c;ctx.lineWidth=st.w;ctx.lineCap=ctx.lineJoin='round';const p=st.p;
 if(st.t=='pen'){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));if(p.length==1)ctx.lineTo(p[0][0]+.1,p[0][1]);ctx.stroke()}
 else if(st.t=='line'||st.t=='arrow'){const [a,b]=[p[0],p[p.length-1]];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  if(st.t=='arrow'){const an=Math.atan2(b[1]-a[1],b[0]-a[0]),L=Math.max(14,st.w*4);ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-L*Math.cos(an-.45),b[1]-L*Math.sin(an-.45));ctx.lineTo(b[0]-L*Math.cos(an+.45),b[1]-L*Math.sin(an+.45));ctx.closePath();ctx.fill()}}
 else if(st.t=='rect'){const [a,b]=[p[0],p[p.length-1]];ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}
 else if(st.t=='text'){const fs=Math.max(18,st.w*5);ctx.font=`800 ${fs}px "Malgun Gothic",sans-serif`;ctx.lineWidth=Math.max(3,fs/6);ctx.strokeStyle=st.c=='#111111'?'#fff':'#000';ctx.strokeText(st.s,p[0][0],p[0][1]);ctx.fillText(st.s,p[0][0],p[0][1])}
 ctx.restore()}
function fbPaint(){const c=$('#fbCv');if(!c||!FB.img)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(FB.img,0,0);FB.strokes.forEach(s=>fbDraw(x,s));if(FB.cur)fbDraw(x,FB.cur)}
function fbMount(){const c=$('#fbCv');if(!c||!FB.img)return;c.width=FB.img.naturalWidth;c.height=FB.img.naturalHeight;fbPaint();
 const pt=e=>{const r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)*c.width/r.width),Math.round((e.clientY-r.top)*c.height/r.height)]};
 const sc=()=>c.width/c.getBoundingClientRect().width;
 c.onpointerdown=e=>{e.preventDefault();const p=pt(e);if(FB.tool=='text'){const t=prompt('적을 글자 (짧게)');if(t&&t.trim()){FB.strokes.push({t:'text',c:FB.color,w:FB.w*sc(),p:[p],s:t.trim()});fbPaint();fbCnt()}return}
  c.setPointerCapture(e.pointerId);FB.cur={t:FB.tool,c:FB.color,w:FB.w*sc(),p:[p]};fbPaint()};
 c.onpointermove=e=>{if(!FB.cur)return;const p=pt(e);if(FB.cur.t=='pen')FB.cur.p.push(p);else FB.cur.p[1]=p;fbPaint()};
 c.onpointerup=c.onpointercancel=()=>{if(!FB.cur)return;if(FB.cur.p.length>1||FB.cur.t=='pen')FB.strokes.push(FB.cur);FB.cur=null;fbPaint();fbCnt()}}
function fbCnt(){const e=$('#fbN');if(e)e.textContent=FB.strokes.length+'개 그림'}
function fbSet(k,v){FB[k]=v;document.querySelectorAll(`[data-fb-${k}]`).forEach(b=>b.classList.toggle('on',b.getAttribute('data-fb-'+k)==String(v)))}
function fbUndo(){FB.strokes.pop();fbPaint();fbCnt()}
function fbClear(){if(FB.strokes.length&&!confirm('다 지울까?'))return;FB.strokes=[];fbPaint();fbCnt()}
function fbBlob(cv){return new Promise(r=>cv.toBlob(r,'image/png'))}
async function fbSave(){if(!FB.img)return toast('먼저 그림을 골라줘');const cm=$('#fbCm').value.trim();if(!FB.strokes.length&&!cm)return toast('표시나 코멘트를 남겨줘');
 const b=$('#fbSaveB');b.disabled=true;b.textContent='저장 중…';
 try{const c=$('#fbCv'),o=document.createElement('canvas');o.width=c.width;o.height=c.height;o.getContext('2d').drawImage(FB.img,0,0);
  const enc=new TextEncoder(),meta=enc.encode(JSON.stringify({title:FB.title,source:FB.source,comment:cm,w:c.width,h:c.height})),
   mark=new Uint8Array(await (await fbBlob(c)).arrayBuffer()),orig=new Uint8Array(await (await fbBlob(o)).arrayBuffer()),st=enc.encode(JSON.stringify({w:c.width,h:c.height,strokes:FB.strokes}));
  const r=await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Parts':[meta.length,mark.length,orig.length,st.length].join(',')},body:new Blob([meta,mark,orig,st])});
  if(!r.ok)throw new Error(await r.text());A.push(await r.json());FB.strokes=[];FB.img=null;toast('저장했어 ✓ 보고 반영할게');render()}
 catch(e){toast('저장 실패: '+e.message);b.disabled=false;b.textContent='💾 저장'}}
function vFeedback(){const src=D.fb_sources||[],past=A.filter(a=>a.kind=='feedback').reverse();seenLater('feedback',t=>tabOfT(t)=='feedback');
 if(!FB.img&&!FB.auto&&src[0]&&!past.some(a=>a.source==src[0].url)){FB.auto=1;setTimeout(()=>fbLoad(src[0].url,src[0].title,src[0].url),0)}
 const tools=FB_TOOLS.map(([k,l])=>`<button class="btn sm opt${FB.tool==k?' on':''}" data-fb-tool="${k}" onclick="fbSet('tool','${k}')">${l}</button>`).join('');
 const cols=FB_COL.map(c=>`<button class="btn sm opt${FB.color==c?' on':''}" data-fb-color="${c}" onclick="fbSet('color','${c}')" style="width:36px;padding:0;background:${c};border-width:3px" title="${c}"></button>`).join('');
 const ws=[3,6,12].map((w,i)=>`<button class="btn sm opt${FB.w==w?' on':''}" data-fb-w="${w}" onclick="fbSet('w',${w})">${['가늘게','보통','굵게'][i]}</button>`).join('');
 return `<h2>그림 피드백</h2><p class=lead>화면을 붙여넣거나(Ctrl+V) 파일을 고르거나 아래 그림 중 하나를 누르고, 위에 선 긋고 코멘트 적어서 저장해줘.</p>
 <div class=row style="margin-bottom:12px"><label class="btn"><input type=file accept="image/*" hidden onchange="fbFile(this.files[0])">📂 파일 고르기</label><span class=small>또는 Ctrl+V · 끌어다 놓기</span></div>
 ${FB.img?`<div class=card><div class=row style="justify-content:space-between"><b style="font-size:19px">${esc(FB.title)}</b><span class=small id=fbN>${FB.strokes.length}개 그림</span></div>
  <div class=row style="margin:10px 0;gap:6px">${tools}<span style="width:12px"></span>${cols}<span style="width:12px"></span>${ws}<span style="width:12px"></span><button class="btn sm" onclick="fbUndo()">↶ 되돌리기</button><button class="btn sm" onclick="fbClear()">🗑 다 지우기</button></div>
  <div style="background:#060d15;border-radius:12px;padding:8px;text-align:center"><canvas id=fbCv style="max-width:100%;max-height:78vh;cursor:crosshair;touch-action:none;image-rendering:pixelated"></canvas></div>
  <textarea id=fbCm rows=3 style="margin-top:10px" placeholder="코멘트 (예: 양옆을 빨간 선까지 줄여줘)"></textarea>
  <div class=row style="margin-top:10px"><button class="btn pri" id=fbSaveB onclick="fbSave()">💾 저장</button><button class="btn" onclick="if(!FB.strokes.length||confirm('그린 거 버릴까?')){FB.img=null;FB.strokes=[];render()}">닫기</button></div></div>`:''}
 <div class=sec><h3>🖼️ 우리가 올린 그림에서 고르기</h3></div>
 <div class=thumbs>${src.map(x=>`<div style="width:150px;cursor:pointer" onclick="fbLoad(${jq(x.url)},${jq(x.title)},${jq(x.url)})"><div class=pic style="width:150px;height:110px"><img src="${esc(x.url)}" loading=lazy style="max-height:104px"></div><div class=small style="line-height:1.3">${x.kind=='game'?'🎮 ':''}${esc(x.title)}</div></div>`).join('')}</div>
 <div class=sec><h3>📋 남긴 피드백</h3><span class=dim>${past.length}개</span></div>
 ${past.length?`<div class=autos style="display:grid;gap:14px">${past.map(a=>`<div class=card><div class=pic style="height:200px" onclick="zoom(${jq(a.file)})"><img src="${esc(a.file)}" loading=lazy style="max-height:190px"></div><b>${esc(a.title)}</b> <span class=small>${when(a.timestamp)}</span>${a.comment?`<div class=small style="white-space:pre-wrap">${esc(a.comment)}</div>`:''}${threadHtml('fb:'+a.id)}</div>`).join('')}</div>`:'<p class=dim>아직 없어.</p>'}`}
</script></html>
